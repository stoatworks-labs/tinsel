  <body>
    <main id="demo">
      <noscript>
        <h1>Tinsel</h1>
        <p>
          An FFGL effect that finds the outlines in a clip and lights them like
          a string of LEDs, running the sort of patterns an LED controller runs
          (chases, comets, twinkles, fire) across twenty patterns and sixteen
          palettes.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/tinsel/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/tinsel/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/tinsel/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/tinsel">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
